name: flyrank-capstone-image-matching
track: backend
status: completed

description: >
  AI-powered backend service that accepts uploaded images, analyzes them
  using Google Gemini, generates semantic embeddings, stores data in
  PostgreSQL, and automatically matches images to relevant posts.

run: docker compose up --build -d

seed: ""

test: docker exec image-matching-api python -m pytest -q

base_url: http://localhost:8000

endpoints:
  - GET /
  - GET /health

  - POST /posts
  - GET /posts
  - GET /posts/{post_id}
  - GET /posts/{post_id}/images

  - POST /images/upload
  - POST /images/{image_id}/approve
  - POST /images/{image_id}/reject
  - GET /images/{image_id}/review
  - POST /images/process-batch

  - GET /suggestions
  - GET /suggestions/{suggestion_id}
  - POST /suggestions/{suggestion_id}/approve
  - POST /suggestions/{suggestion_id}/reject

  - GET /ai-usage